<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡我們</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .contact-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    .contact-card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #666;
    }
    .form-group input, 
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-submit:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="contact-card">
    <h2>聯絡我們</h2>
    <!-- 請將 YOUR_FORM_ID 替換為你在 Formspree 取得的 ID -->
    <action action="https://formspree.io/f/mgaaqkak" method="POST">
      
      <div class="form-group">
        <label for="name">姓名</label>
        <input type="text" id="name" name="姓名" required placeholder="請輸入姓名">
      </div>

      <div class="form-group">
        <label for="phone">電話</label>
        <input type="tel" id="phone" name="電話" required placeholder="請輸入聯絡電話">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="Email" required placeholder="請輸入電子郵件">
      </div>

      <div class="form-group">
        <label for="message">聯絡內容</label>
        <textarea id="message" name="聯絡內容" rows="5" required placeholder="請輸入留言內容..."></textarea>
      </div>

      <button type="submit" class="btn-submit">送出訊息</button>
    </form>
  </div>

</body>
</html>
